services:
  postgres:
    image: postgres:16
    container_name: meta-ads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meta_ads
    ports:
      - "5432:5432"
    volumes:
      - meta_ads_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meta_ads"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meta_ads_postgres_data:
